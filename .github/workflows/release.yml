# The open copy's release, run by GitHub Actions: the colleague kit built from
# a tag of the public repository and attached, with its SHA256SUMS, to that
# tag's GitHub Release.
#
# A release is always of a tag. Both jobs refuse a run whose ref is not a tag,
# naming the ref, so a dispatch must be started on a tag ref.
#
# Draft and final. A dispatch can only start on a tag that is already on
# GitHub, so the tag push has normally published the release by then:
#
#   * a tag push creates the release final, or, when it exists, re-uploads
#     both assets with --clobber and makes it final with
#     `gh release edit <tag> --draft=false`;
#   * a dispatch is the re-run and recovery path. With `draft: true` (the
#     default) it creates a draft when no release exists, re-uploads into an
#     existing draft, and refuses, naming the tag, when the release exists and
#     is already published -- it never replaces a published release's assets.
#     With `draft: false` it behaves as the tag push;
#   * a `gh release view` that fails for any reason but "release not found"
#     fails the step, so an outage is never taken for a missing release;
#   * runs on the same tag queue behind one another (the concurrency group),
#     so a push and a dispatch never create the release twice.
#
# The release body is written here, not read from a file: the showcase keeps
# no release notes. It names the tag, the SWCraft version the kit is pinned
# to, and the kit's SHA256SUMS line. The version is read from swcraft.yaml
# with the repository's own parser in the `kit` job and handed on as that
# job's output, so `publish` needs no checkout -- and no literal here is a
# second pin to keep in step with the manifest.
#
# Every job carries `if: github.server_url == 'https://github.com'`, so the
# file is inert on any other host that reads .github/workflows/. No secret is
# read: `publish` uses the run's own token, with `contents: write` granted to
# that job alone.
#
# Every action is pinned by its full commit SHA, with the exact release tag it
# was read from in the comment. upload-artifact and download-artifact are
# versioned apart; every pair from v4 on uses the same artifact backend, so
# each stands at its own latest release.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "A draft when no release exists, or upload into the existing draft; a published release is refused"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kit:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      swcraft_version: ${{ steps.pin.outputs.version }}
    steps:
      - name: refuse a ref that is not a tag
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "A release is always of a tag, and $REF is not a tag ref: start the run on a tag." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: tests
        run: python -m unittest discover -s tests -v

      - name: read the pin
        id: pin
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from build_colleague_kit import parse_toolchain_version

          print(parse_toolchain_version(Path("swcraft.yaml").read_text(encoding="utf-8")))
          PY
          )
          echo "swcraft.yaml pins SWCraft $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: build the colleague kit
        env:
          SWCRAFT_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/build_colleague_kit.py --swcraft-version "$SWCRAFT_VERSION" --tagged
          cat dist/colleague-kit/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colleague-kit
          path: |
            dist/colleague-kit/*.zip
            dist/colleague-kit/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.server_url == 'https://github.com'
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: refuse a ref that is not a tag
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "A release is always of a tag, and $REF is not a tag ref: start the run on a tag." >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: colleague-kit
          path: kit

      - name: create or update the release
        working-directory: kit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SWCRAFT_VERSION: ${{ needs.kit.outputs.swcraft_version }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "The kit artifact holds ${#zips[@]} zips, not one: nothing is released for $TAG." >&2
            exit 1
          fi
          notes=$(printf 'Vehicle Control showcase kit `%s`, pinned to SWCraft `%s`.\n\n```\n%s\n```\n' \
            "$TAG" "$SWCRAFT_VERSION" "$(cat SHA256SUMS)")
          err=$(mktemp)
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$err"); then
            exists=true
          elif grep -q "release not found" "$err"; then
            exists=false
          else
            cat "$err" >&2
            exit 1
          fi
          if [ "$exists" = false ]; then
            create_args=()
            if [ "$DRAFT" = true ]; then create_args+=(--draft); fi
            gh release create "$TAG" "${zips[@]}" SHA256SUMS "${create_args[@]}" --verify-tag --title "$TAG" --notes "$notes"
          elif [ "$DRAFT" = true ] && [ "$is_draft" != true ]; then
            echo "The release $TAG is already published: a dispatch with draft: true does not replace its assets. Dispatch with draft: false to re-upload into it." >&2
            exit 1
          else
            gh release upload "$TAG" "${zips[@]}" SHA256SUMS --clobber
            gh release edit "$TAG" --notes "$notes"
            if [ "$DRAFT" != true ]; then
              gh release edit "$TAG" --draft=false
            fi
          fi
